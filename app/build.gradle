plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gamaliel.finanzas'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gamaliel.finanzas'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Firma fija: cada versión nueva se instala encima sin perder los datos.
    signingConfigs {
        fija {
            storeFile file('firma.jks')
            storePassword 'finanzas'
            keyAlias 'finanzas'
            keyPassword 'finanzas'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fija
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fija
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
