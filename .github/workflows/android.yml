name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK para Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Número de versión
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName '1.0'/versionName '1.${{ github.run_number }}'/" app/build.gradle
          grep -n "version" app/build.gradle

      - name: Compilar APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0
          cp app/build/outputs/apk/release/app-release.apk ControlFinanzas.apk

      - name: Guardar errores de compilación
        if: failure()
        run: |
          mkdir -p /tmp/reg && cd /tmp/reg
          grep -E "^e: |error:|FAILURE|FAILED|What went wrong|Exception" -A3 "$GITHUB_WORKSPACE/build.log" | head -300 > errores.txt || true
          tail -150 "$GITHUB_WORKSPACE/build.log" > final.txt || true
          git init -q -b registro && git config user.name GamalielHu && git config user.email gamalielhu@users.noreply.github.com
          git add -A && git commit -qm "errores ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" registro

      - uses: actions/upload-artifact@v4
        with:
          name: ControlFinanzas-apk
          path: ControlFinanzas.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Control Finanzas 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: ControlFinanzas.apk
          make_latest: true
          body: |
            Descarga **ControlFinanzas.apk** y ábrelo en el celular para instalar.
            Ingresos de la heladería (Cerpi y Cementerio, turnos Mañana y Tarde), gastos de la heladería y personales, ganancia real y temporadas.
            Las versiones nuevas se instalan encima sin perder los datos.
